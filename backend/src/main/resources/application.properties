spring.application.name=backend

server.port=8080

# Lokale Entwicklung: .env aus dem Hauptverzeichnis einlesen (optional, wird nicht committet).
# Im Docker-Container gibt es die Datei nicht, dort kommen die Werte aus docker-compose.yml.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Datenbank
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_HOST_PORT:5432}/${POSTGRES_DB:sportplatzfinder}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:sportplatzfinder}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}

# JPA: Hibernate erzeugt oder ändert das Datenbankschema nicht automatisch
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# OAuth2 Resource Server (Keycloak) - wird erst aufgerufen, wenn ein Token geprüft wird
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sportplatzfinder}
