spring.application.name=backend

server.port=8080

# Datenbank (Werte kommen aus Umgebungsvariablen, siehe .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportplatzfinder}
spring.datasource.username=${DB_USERNAME:sportplatzfinder}
spring.datasource.password=${DB_PASSWORD:}

# JPA: Schema wird später über Flyway verwaltet, nicht von Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# OAuth2 Resource Server (Keycloak) - wird erst aufgerufen, wenn ein Token geprüft wird
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sportplatzfinder}
